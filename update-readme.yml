name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from GitHub Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout your repo ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Fetch GitHub Stats via API ──────────────────────────────────────
      - name: Fetch GitHub Stats
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: EIMAN-RAZA
        run: |
          # GraphQL query — grabs commits, stars, PRs, issues, repos
          QUERY='
          query($login: String!) {
            user(login: $login) {
              repositories(first: 100, ownerAffiliations: OWNER, privacy: PUBLIC) {
                nodes {
                  stargazerCount
                  primaryLanguage { name }
                }
              }
              contributionsCollection {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
              repositoriesContributedTo(first: 1, contributionTypes: [COMMIT, ISSUE, PULL_REQUEST]) {
                totalCount
              }
            }
          }'

          RESPONSE=$(curl -s -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"query\": \"$(echo $QUERY | tr -d '\n' | sed 's/"/\\"/g')\", \"variables\": {\"login\": \"$USERNAME\"}}" \
            https://api.github.com/graphql)

          echo "response=$RESPONSE" >> $GITHUB_OUTPUT

          # Parse values with jq
          TOTAL_COMMITS=$(echo $RESPONSE | jq '.data.user.contributionsCollection.totalCommitContributions')
          TOTAL_PRS=$(echo $RESPONSE | jq '.data.user.contributionsCollection.totalPullRequestContributions')
          TOTAL_ISSUES=$(echo $RESPONSE | jq '.data.user.contributionsCollection.totalIssueContributions')
          CONTRIBUTED_TO=$(echo $RESPONSE | jq '.data.user.repositoriesContributedTo.totalCount')
          TOTAL_STARS=$(echo $RESPONSE | jq '[.data.user.repositories.nodes[].stargazerCount] | add // 0')

          echo "commits=$TOTAL_COMMITS" >> $GITHUB_OUTPUT
          echo "prs=$TOTAL_PRS" >> $GITHUB_OUTPUT
          echo "issues=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
          echo "contributed=$CONTRIBUTED_TO" >> $GITHUB_OUTPUT
          echo "stars=$TOTAL_STARS" >> $GITHUB_OUTPUT

      # ── 3. Calculate streak ────────────────────────────────────────────────
      - name: Calculate Streak
        id: streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: EIMAN-RAZA
        run: |
          python3 << 'EOF'
          import json, os, subprocess, datetime

          # Fetch last 52 weeks of contribution data
          query = """
          {
            user(login: "EIMAN-RAZA") {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          result = subprocess.run(
            ["curl", "-s",
             "-H", f"Authorization: bearer {os.environ['GH_TOKEN']}",
             "-H", "Content-Type: application/json",
             "-X", "POST",
             "-d", json.dumps({"query": query}),
             "https://api.github.com/graphql"],
            capture_output=True, text=True
          )

          data = json.loads(result.stdout)
          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          # Flatten all days, sorted
          days = []
          for week in weeks:
            for day in week["contributionDays"]:
              days.append((day["date"], day["contributionCount"]))
          days.sort()

          today = datetime.date.today().isoformat()

          # Current streak (working backwards from today)
          current_streak = 0
          for date, count in reversed(days):
            if date > today:
              continue
            if count > 0:
              current_streak += 1
            else:
              break

          # Longest streak ever
          longest_streak = 0
          running = 0
          for _, count in days:
            if count > 0:
              running += 1
              longest_streak = max(longest_streak, running)
            else:
              running = 0

          # Total contributions this year
          total_contributions = sum(c for _, c in days)

          # First contribution date
          first_contrib = next((d for d, c in days if c > 0), "N/A")
          last_contrib  = next((d for d, c in reversed(days) if c > 0), "N/A")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"current={current_streak}\n")
            f.write(f"longest={longest_streak}\n")
            f.write(f"total={total_contributions}\n")
            f.write(f"first={first_contrib}\n")
            f.write(f"last={last_contrib}\n")

          print(f"Current streak: {current_streak}, Longest: {longest_streak}, Total: {total_contributions}")
          EOF

      # ── 4. Update README with fresh badge URLs ─────────────────────────────
      - name: Update README
        env:
          CURRENT_STREAK: ${{ steps.streak.outputs.current }}
          LONGEST_STREAK: ${{ steps.streak.outputs.longest }}
          TOTAL_CONTRIBUTIONS: ${{ steps.streak.outputs.total }}
          FIRST_CONTRIB: ${{ steps.streak.outputs.first }}
          LAST_CONTRIB: ${{ steps.streak.outputs.last }}
          TOTAL_COMMITS: ${{ steps.stats.outputs.commits }}
          TOTAL_PRS: ${{ steps.stats.outputs.prs }}
          TOTAL_ISSUES: ${{ steps.stats.outputs.issues }}
          CONTRIBUTED_TO: ${{ steps.stats.outputs.contributed }}
          TOTAL_STARS: ${{ steps.stats.outputs.stars }}
          UPDATED: ${{ github.run_id }}
        run: |
          python3 << 'EOF'
          import os, re, datetime

          current    = os.environ.get("CURRENT_STREAK", "0")
          longest    = os.environ.get("LONGEST_STREAK", "0")
          total      = os.environ.get("TOTAL_CONTRIBUTIONS", "0")
          first      = os.environ.get("FIRST_CONTRIB", "N/A")
          last       = os.environ.get("LAST_CONTRIB", "N/A")
          commits    = os.environ.get("TOTAL_COMMITS", "0")
          prs        = os.environ.get("TOTAL_PRS", "0")
          issues     = os.environ.get("TOTAL_ISSUES", "0")
          contrib_to = os.environ.get("CONTRIBUTED_TO", "0")
          stars      = os.environ.get("TOTAL_STARS", "0")
          today      = datetime.date.today().strftime("%b %d, %Y")

          with open("README.md", "r") as f:
            content = f.read()

          # ── Replace the GitHub Stats section entirely ──
          stats_block = f"""## 📊 GitHub Stats

<div align="center">

<!-- AUTO-UPDATED by GitHub Actions every day at midnight UTC -->
<!-- Last updated: {today} -->

| 🔥 Streak | 📊 Commits | ⭐ Stars |
|:---:|:---:|:---:|
| **{current} days** current · **{longest} days** longest | **{commits}** this year | **{stars}** total |

| 🔀 Pull Requests | 🐛 Issues | 🤝 Contributed To |
|:---:|:---:|:---:|
| **{prs}** | **{issues}** | **{contrib_to}** repos |

**Total contributions this year:** {total} &nbsp;|&nbsp; **First contribution:** {first} &nbsp;|&nbsp; **Latest:** {last}

![GitHub Stats](https://github-readme-stats.vercel.app/api?username=EIMAN-RAZA&show_icons=true&theme=github_dark&hide_border=true&count_private=true&include_all_commits=true)
&nbsp;
![Top Languages](https://github-readme-stats.vercel.app/api/top-langs/?username=EIMAN-RAZA&layout=compact&theme=github_dark&hide_border=true)

</div>"""

          # Replace between ## 📊 GitHub Stats and the next ## heading
          content = re.sub(
            r"## 📊 GitHub Stats.*?(?=\n---|\n## )",
            stats_block + "\n\n",
            content,
            flags=re.DOTALL
          )

          with open("README.md", "w") as f:
            f.write(content)

          print("README.md updated successfully")
          EOF

      # ── 5. Commit and push ─────────────────────────────────────────────────
      - name: Commit changes
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commit if something actually changed
          git diff --staged --quiet || git commit -m "chore: update GitHub stats [$(date +'%Y-%m-%d')]"
          git push
